name: MATLAB tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
      - name: Run test suite
        uses: matlab-actions/run-command@v3
        with:
          command: results = runtests("tests"); assertSuccess(results);
